name: Build Digital Icon Awards

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production files
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: digital-icon-awards-dist
          path: dist
